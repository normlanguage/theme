name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Norm
        run: |
          $base = 'https://github.com/normlanguage/Norm/releases/download/v0.25.4'
          $tools = Join-Path $env:RUNNER_TEMP 'norm-tools'
          New-Item -ItemType Directory -Force $tools | Out-Null
          Invoke-WebRequest "$base/norm.exe" -OutFile "$tools/norm.exe"
          Invoke-WebRequest "$base/SHA256SUMS" -OutFile "$tools/SHA256SUMS"
          $sums = Get-Content -Raw "$tools/SHA256SUMS"
          $expected = [regex]::Match($sums, '(?m)^([a-fA-F0-9]{64})\s+norm\.exe\s*$').Groups[1].Value
          $actual = (Get-FileHash "$tools/norm.exe" -Algorithm SHA256).Hash
          if (!$expected -or $actual -ne $expected) { throw 'Norm checksum mismatch' }
          $tools | Out-File -FilePath $env:GITHUB_PATH -Append
          "JAVA_HOME=$env:JAVA_HOME_21_X64" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build and check
        run: |
          ./scripts/build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/norm.ps1 check theme
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- theme/module.norm
      - name: Color kernel references
        run: |
          & "$env:JAVA_HOME/bin/javac.exe" --release 21 -cp build/classes -d build/test-classes src/test/java/dev/normlanguage/theme/ColorMathTest.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:JAVA_HOME/bin/java.exe" -cp 'build/classes;build/test-classes' dev.normlanguage.theme.ColorMathTest
      - name: Theme contracts
        run: ./scripts/norm.ps1 test theme
      - name: Package
        run: ./scripts/norm.ps1 package theme --output build/repository
      - name: Archive consumer and desktop acceptance
        run: |
          ./scripts/desktop.ps1 -Verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/norm.ps1 run samples/basic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- theme/module.norm samples/desktop/module.norm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: theme-candidate
          path: |
            build/repository
            build/desktop-preview.png
